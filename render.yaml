# Blueprint de Render para el backend de Segundo.
# En https://dashboard.render.com → New → Blueprint → conectar este repo.
# Un solo proceso uvicorn (sin --workers): el rate limiter de slowapi vive en
# memoria por proceso (V3-10 en segundo/docs/seguridad/SECURITY.md); antes de
# escalar a varios workers/instancias hay que mover el storage a Redis.
services:
  - type: web
    name: segundo-backend
    runtime: python
    rootDir: segundo/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL # postgresql+asyncpg://... (la misma de Supabase del .env local)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: VOYAGE_API_KEY
        sync: false
      - key: CORS_ORIGINS # URL del frontend en Vercel, p. ej. https://segundo.vercel.app
        sync: false
      - key: ASK_RATE_LIMIT
        value: 10/minute
